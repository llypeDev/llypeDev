<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" fill="none" role="img" aria-labelledby="t">
<title id="t">Rodapé animado: obrigado pela visita — sempre aprendendo e construindo</title>
<style>

.star { fill: #F8F8F2; opacity: .5; animation: twinkle 4s ease-in-out infinite; }
@keyframes twinkle { 0%, 100% { opacity: .12; } 50% { opacity: .9; } }
.glyph { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace; font-weight: 700; fill: #BD93F9; opacity: .22; animation: rise 12s linear infinite; }
.glyph:nth-of-type(3n) { fill: #FF79C6; }
.glyph:nth-of-type(3n+1) { fill: #8BE9FD; }
@keyframes rise {
  0% { transform: translateY(24px); opacity: 0; }
  20%, 75% { opacity: .32; }
  100% { transform: translateY(-60px); opacity: 0; }
}
.wave { animation: slide 12s linear infinite; }
@keyframes slide { from { transform: translateX(0); } to { transform: translateX(-1200px); } }
.blob { animation: drift 16s ease-in-out infinite alternate; }
.blob.b2 { animation-duration: 20s; animation-delay: -6s; }
.blob.b3 { animation-duration: 13s; animation-delay: -3s; }
@keyframes drift { from { transform: translate(-30px, -10px); } to { transform: translate(40px, 18px); } }
.title { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace; font-size: 44px; font-weight: 700; letter-spacing: -1px; }
.br { fill: #FF79C6; }
.halo { opacity: .55; animation: breathe 4s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { opacity: .35; } 50% { opacity: .75; } }
.sub { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #F8F8F2; letter-spacing: .5px;
        animation: up 1.2s cubic-bezier(.2,.8,.2,1) both .3s; }
.dot { fill: #BD93F9; }
@keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: .92; transform: translateY(0); } }
.bar { transform-box: fill-box; transform-origin: 50% 50%; animation: grow 3.2s ease-in-out infinite alternate; }
@keyframes grow { from { transform: scaleX(.25); } to { transform: scaleX(1); } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>

