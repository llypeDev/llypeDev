<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#191A21"/><stop offset=".55" stop-color="#282A36"/><stop offset="1" stop-color="#2B2140"/>
</linearGradient>
<radialGradient id="glowP"><stop offset="0" stop-color="#BD93F9" stop-opacity=".55"/><stop offset="1" stop-color="#BD93F9" stop-opacity="0"/></radialGradient>
<radialGradient id="glowK"><stop offset="0" stop-color="#FF79C6" stop-opacity=".40"/><stop offset="1" stop-color="#FF79C6" stop-opacity="0"/></radialGradient>
<radialGradient id="glowC"><stop offset="0" stop-color="#8BE9FD" stop-opacity=".25"/><stop offset="1" stop-color="#8BE9FD" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
  <path d="M40 0H0V40" stroke="#44475A" stroke-width="1"/>
</pattern>
<radialGradient id="gridFade" cx=".5" cy=".45" r=".6">
  <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
</radialGradient>
<mask id="gridMask"><rect width="1200" height="190" fill="url(#gridFade)"/></mask>
<linearGradient id="tg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="repeat">
  <stop offset="0" stop-color="#BD93F9"/><stop offset=".33" stop-color="#FF79C6"/>
  <stop offset=".66" stop-color="#8BE9FD"/><stop offset="1" stop-color="#BD93F9"/>
  <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="600 0" dur="6s" repeatCount="indefinite"/>
</linearGradient>
<filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>

