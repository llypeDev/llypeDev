<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="14" viewBox="0 0 1000 14" fill="none" role="img" aria-labelledby="t">
<title id="t">Divisor animado</title>
<style>

.spark { animation: zip 5s cubic-bezier(.45,0,.55,1) infinite; }
@keyframes zip { 0% { transform: translateX(80px); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateX(920px); opacity: 0; } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>

<linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#BD93F9" stop-opacity="0"/>
<stop offset=".5" stop-color="#BD93F9" stop-opacity=".55"/><stop offset="1" stop-color="#BD93F9" stop-opacity="0"/></linearGradient>
<radialGradient id="sp"><stop offset="0" stop-color="#FF79C6"/><stop offset=".4" stop-color="#FF79C6" stop-opacity=".6"/>
<stop offset="1" stop-color="#FF79C6" stop-opacity="0"/></radialGradient>

</defs>
<rect y="6.0" width="1000" height="2" rx="1" fill="url(#ln)"/><ellipse class="spark" cx="0" cy="7.0" rx="60" ry="5" fill="url(#sp)"/>
</svg>
