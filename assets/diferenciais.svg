<svg xmlns="http://www.w3.org/2000/svg" width="1028" height="226" viewBox="0 0 1028 226" fill="none" role="img" aria-labelledby="t">
<title id="t">Meus diferenciais: Inteligência Artificial, Análise de Dados, Banco de Dados (SQL e NoSQL) e Kanban com práticas ágeis — cada um com uma pequena animação.</title>
<style>

.card { fill: #282A36; }
.edge { stroke-width: 1.5; animation: edge 3.6s ease-in-out infinite; }
@keyframes edge { 0%, 100% { stroke-opacity: .3; } 50% { stroke-opacity: .95; } }
.ttl { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 18.5px; font-weight: 700; fill: #F8F8F2; }
.cap { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 14.5px; fill: #A9B1D6; }
.lbl { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: 700; letter-spacing: .6px; }
/* IA */
.syn { stroke: #BD93F9; stroke-opacity: .18; stroke-width: 1.2; }
.flow { stroke: #BD93F9; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 3 22; animation: flow 1.4s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -25; } }
.node { fill: #282A36; stroke: #BD93F9; stroke-width: 2; animation: node 2.1s ease-in-out infinite; }
@keyframes node { 0%, 100% { fill: #282A36; } 40% { fill: #BD93F9; } }
/* Dados */
.bar { transform-box: fill-box; transform-origin: 50% 100%; }
.trend { stroke: #FF79C6; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none;
          stroke-dasharray: 260; animation: draw 4.5s ease-in-out infinite; }
@keyframes draw { 0% { stroke-dashoffset: 260; opacity: 1; } 55%, 85% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
.pt { fill: #FF79C6; transform-box: fill-box; transform-origin: center; animation: pop 4.5s ease-in-out infinite; }
@keyframes pop { 0%, 50% { transform: scale(0); } 58%, 85% { transform: scale(1); } 100% { transform: scale(0); } }
/* Banco */
.seg { fill: #50FA7B; animation: seg 2.4s ease-in-out infinite; }
@keyframes seg { 0%, 100% { fill-opacity: .10; } 30% { fill-opacity: .55; } }
.rec { fill: #50FA7B; animation: drop 2.4s ease-in infinite; }
@keyframes drop { 0% { transform: translateY(-20px); opacity: 0; } 30% { opacity: 1; } 80% { transform: translateY(8px); opacity: 1; } 100% { transform: translateY(12px); opacity: 0; } }
.scan { animation: scan 2.4s ease-in-out infinite; }
@keyframes scan { 0%, 100% { transform: translateX(-6px); opacity: .25; } 50% { transform: translateX(6px); opacity: .8; } }
/* Kanban */
.task { fill: #44475A; }
.mover { animation: move 7s cubic-bezier(.65,0,.35,1) infinite; }
@keyframes move {
  0%, 18% { transform: translate(0, 0); opacity: 1; }
  24% { transform: translate(35px, -9px); }
  30%, 50% { transform: translate(70px, 0); }
  56% { transform: translate(105px, -9px); }
  62%, 88% { transform: translate(140px, 0); opacity: 1; }
  95% { transform: translate(140px, 0); opacity: 0; }
  96% { transform: translate(0, 0); opacity: 0; }
  100% { transform: translate(0, 0); opacity: 1; }
}
.check { stroke: #50FA7B; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round;
          stroke-dasharray: 14; animation: check 7s ease-in-out infinite; }
@keyframes check { 0%, 66% { stroke-dashoffset: 14; } 74%, 88% { stroke-dashoffset: 0; opacity: 1; } 95%, 100% { stroke-dashoffset: 0; opacity: 0; } }

@keyframes b0 { from { transform: scaleY(0.58); } to { transform: scaleY(1); } }
@keyframes b1 { from { transform: scaleY(0.55); } to { transform: scaleY(1); } }
@keyframes b2 { from { transform: scaleY(0.42); } to { transform: scaleY(1); } }
@keyframes b3 { from { transform: scaleY(0.40); } to { transform: scaleY(1); } }
@keyframes b4 { from { transform: scaleY(0.48); } to { transform: scaleY(1); } }
@keyframes b5 { from { transform: scaleY(0.56); } to { transform: scaleY(1); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
